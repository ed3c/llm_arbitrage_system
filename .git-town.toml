#:schema https://www.git-town.com/git-town.schema.json

# Repository policy only. Live execution remains blocked until the host admission
# and Worker controls in docs/git/ are PASS on the exact subject.

[branches]
main = "main"

[create]
new-branch-type = "feature"
push-new-branches = false
share-new-branches = "no"
stash = false

[hosting]
dev-remote = "origin"
forge-type = "github"

[ship]
delete-tracking-branch = false
enter-message = false
ignore-uncommitted = false

[sync]
auto-resolve = false
auto-sync = false
detached = false
feature-strategy = "merge"
perennial-strategy = "ff-only"
prototype-strategy = "merge"
push-branches = false
push-hook = false
tags = false
upstream = false

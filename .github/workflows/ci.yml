name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  quality:
    name: Quality gates (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Tests and coverage
        run: >-
          pytest
          --cov=llm_arbitrage_system
          --cov-report=term-missing
          --cov-fail-under=70
      - name: Phase 3 experiment smoke
        run: |
          llm-arbitrage validate-dataset examples/phase3/market_events.jsonl
          llm-arbitrage validate-config examples/phase3/experiment.yaml
          llm-arbitrage run \
            --dataset examples/phase3/market_events.jsonl \
            --config examples/phase3/experiment.yaml \
            --output .phase3-runs \
            --code-revision "$GITHUB_SHA"
          BUNDLE="$(find .phase3-runs -mindepth 1 -maxdepth 1 -type d -name 'exp-*' -print -quit)"
          test -n "$BUNDLE"
          llm-arbitrage verify "$BUNDLE"
          llm-arbitrage plan-matrix \
            --dataset examples/phase3/market_events.jsonl \
            --config examples/phase3/experiment.yaml \
            --sweep examples/phase3/sweep.yaml \
            --output .phase3-runs/matrix.json
      - name: Phase 4 trust and registry smoke
        run: bash scripts/phase4_smoke.sh
      - name: Phase 5 resumable campaign smoke
        run: bash scripts/phase5_smoke.sh

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run compatibility tests
        run: pytest
